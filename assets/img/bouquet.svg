<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Tallos del ramo -->
  <g stroke="#15803d" stroke-width="4" stroke-linecap="round">
    <path d="M100,180 Q85,130 65,95"/>
    <path d="M100,180 Q100,120 100,80"/>
    <path d="M100,180 Q115,130 135,95"/>
    <path d="M100,180 Q70,140 45,120"/>
    <path d="M100,180 Q130,140 155,120"/>
  </g>
  <!-- Hojas verdes frescas -->
  <g fill="#4ade80" opacity="0.9">
    <ellipse cx="78" cy="130" rx="10" ry="5" transform="rotate(-35 78 130)"/>
    <ellipse cx="122" cy="130" rx="10" ry="5" transform="rotate(35 122 130)"/>
    <ellipse cx="90" cy="110" rx="9" ry="4" transform="rotate(-20 90 110)"/>
    <ellipse cx="110" cy="110" rx="9" ry="4" transform="rotate(20 110 110)"/>
  </g>
  <!-- Lazo y cinta del ramo -->
  <path d="M85,160 Q100,168 115,160 Q100,152 85,160 Z" fill="#f43f5e"/>
  <circle cx="100" cy="160" r="7" fill="#fb7185"/>
  <path d="M96,165 Q85,185 75,190" stroke="#f43f5e" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M104,165 Q115,185 125,190" stroke="#f43f5e" stroke-width="4" stroke-linecap="round" fill="none"/>
  
  <!-- Tulipán izquierdo -->
  <g transform="translate(65, 95)">
    <path d="M0,0 C-15,-20 -20,-40 0,-45 C20,-40 15,-20 0,0 Z" fill="#fb7185"/>
    <path d="M0,0 C-8,-20 -10,-38 0,-42 C10,-38 8,-20 0,0 Z" fill="#f43f5e"/>
  </g>
  <!-- Tulipán derecho -->
  <g transform="translate(135, 95)">
    <path d="M0,0 C-15,-20 -20,-40 0,-45 C20,-40 15,-20 0,0 Z" fill="#fda4af"/>
    <path d="M0,0 C-8,-20 -10,-38 0,-42 C10,-38 8,-20 0,0 Z" fill="#fb7185"/>
  </g>
  <!-- Margarita izquierda -->
  <g transform="translate(45, 120)">
    <circle cx="0" cy="0" r="14" fill="#ffffff" stroke="#fecdd3" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="6" fill="#facc15"/>
  </g>
  <!-- Margarita derecha -->
  <g transform="translate(155, 120)">
    <circle cx="0" cy="0" r="14" fill="#ffffff" stroke="#fecdd3" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="6" fill="#facc15"/>
  </g>
  <!-- Rosa central principal -->
  <g transform="translate(100, 80)">
    <circle cx="0" cy="0" r="26" fill="#fda4af"/>
    <circle cx="0" cy="0" r="21" fill="#fb7185"/>
    <circle cx="0" cy="0" r="15" fill="#f43f5e"/>
    <circle cx="0" cy="0" r="9" fill="#e11d48"/>
    <path d="M-6,-4 Q0,-12 6,-4 Q0,2 -6,-4 Z" fill="#ffe4e6"/>
  </g>
  <!-- Destellos dorados mágicos -->
  <g fill="#f59e0b">
    <circle cx="50" cy="65" r="2.5"/>
    <circle cx="150" cy="65" r="2.5"/>
    <circle cx="100" cy="40" r="3"/>
    <circle cx="75" cy="48" r="2"/>
    <circle cx="125" cy="48" r="2"/>
  </g>
</svg>
